name: .NET

on: [push, pull_request]

env:
  EXCLUDE_RUN_ID_FROM_PACKAGE: false
  EXCLUDE_SUFFIX_FROM_VERSION: false

jobs:

  # Build the whole Shmuelie.WinRTServer solution
  build-solution:
    strategy:
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: NuGet Restore
      run: nuget restore
    - name: Build
      run: msbuild /t:restore`;build /p:Configuration=${{matrix.configuration}} /p:Platform=x64 /bl
    - name: Test
      run: |
        dotnet test .\tests\Shmuelie.WinRTServer.Tests\Shmuelie.WinRTServer.Tests.csproj -c ${{matrix.configuration}} -p:Platform=x64
        dotnet test .\tests\Shmuelie.WinRTServer.SourceGenerator.Tests\Shmuelie.WinRTServer.SourceGenerator.Tests.csproj -c ${{matrix.configuration}}
    - name: Upload MSBuild binary log
      uses: actions/upload-artifact@v4
      with:
        name: msbuild_log_${{matrix.configuration}}
        path: msbuild.binlog
        if-no-files-found: error
      if: always()

  # Build the only in Release to generate all the NuGet packages.
  # This workflow also uploads the resulting packages as artifacts.
  build-packages:
    runs-on: windows-2025
    steps:
    - name: Git checkout
      uses: actions/checkout@v4
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: NuGet Restore
      run: nuget restore
    - name: Build
      run: msbuild .\src\Shmuelie.WinRTServer\Shmuelie.WinRTServer.csproj /t:restore`;build /p:Configuration=Release
    - name: Pack
      run: |
        msbuild .\src\Shmuelie.WinRTServer.Annotations\Shmuelie.WinRTServer.Annotations.csproj /t:restore`;pack /p:Configuration=Release
        msbuild .\src\Shmuelie.WinRTServer\Shmuelie.WinRTServer.csproj /t:pack /p:Configuration=Release
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget_packages
        path: artifacts\*.nupkg
        if-no-files-found: error

  # Publish the packages to GitHub packages
  publish-nightlies-github:
    needs: [build-solution, build-packages]
    runs-on: windows-2025
    if: ${{github.event_name == 'push'}}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget_packages
        path: artifacts
    - run: dotnet nuget push "artifacts\*.nupkg" --source "https://nuget.pkg.github.com/${{github.repository_owner}}/index.json" --api-key ${{secrets.GITHUB_TOKEN}} --skip-duplicate

  # Publish release builds (pushes to rel/<x.y.z> branches) to NuGet.org
  publish-release-nuget:
    needs: [build-solution, build-packages]
    runs-on: windows-2025
    if: ${{github.event_name == 'push' && startsWith(github.ref_name, 'rel/')}}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: nuget_packages
        path: artifacts
    - run: dotnet nuget push "artifacts\*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{secrets.NUGET_API_KEY}} --skip-duplicate

